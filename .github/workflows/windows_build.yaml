name: Build Windows App
on:
  push:
    branches: [master]
    paths-ignore:
      - README.txt
  workflow_dispatch: 

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      FLET_CLI_NO_RICH_OUTPUT: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "flet-cli==0.86.0"

      - name: Build Windows Executable
        run: |
          flet build windows --yes --no-rich-output

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: build/windows
          if-no-files-found: error

      - name: Archive Windows App for release
        shell: pwsh
        run: Compress-Archive -Path build/windows/* -DestinationPath windows-app.zip

      - name: Update Windows release
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload windows windows-app.zip --clobber
          # Remove the legacy download after successfully uploading its replacement.
          assets=$(gh release view windows --json assets --jq '.assets[].name | select(. == "windows-app.1.zip")')
          if [ -n "$assets" ]; then
            gh release delete-asset windows windows-app.1.zip --yes
          fi
