name: Build macOS App
on:
  push:
    branches: [master]
    paths-ignore:
      - README.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      FLET_CLI_NO_RICH_OUTPUT: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "flet-cli==0.86.0"

      - name: Build macOS App (Apple Silicon and Intel)
        run: flet build macos --arch arm64 x86_64 --yes --no-rich-output

      # Archive first so artifact upload preserves app permissions and symlinks.
      - name: Archive macOS App
        run: tar -czf macos-app.tar.gz -C build/macos .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: macos-app.tar.gz
          if-no-files-found: error

      - name: Update macOS release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload macOS macos-app.tar.gz --clobber
          # Remove the legacy download after successfully uploading its replacement.
          assets=$(gh release view macOS --json assets --jq '.assets[].name | select(. == "macos-app.1.zip")')
          if [ -n "$assets" ]; then
            gh release delete-asset macOS macos-app.1.zip --yes
          fi
