
[project]
name = "zoids_ttrpg_reg"
version = "0.1.0"
description = "Zoids TTRPG Random Encounter Generator"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flet==0.86.0",
]

[tool.flet]
main-module = "main"
[tool.flet.app]
include = ["zoids.json", "stats.json", "abilities.json", "encounters.json", "loot.json", "assets/icon.png", "assets/icon.ico"]
exclude = ["source", "tests", "tools", ".git", ".idea", ".venv", "build", "__pycache__", "**/__pycache__", "*.csv", "*.sqlite3", "*.sqlite3-*"]
